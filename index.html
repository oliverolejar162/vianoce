<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Christmas Party RSVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Great+Vibes&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: a single invitation card on a snowy pine-night ground, guest wizard steps inside the card; admin uses the same paper on a wider grid. Deliberately one look in both themes. */
:root {
  --night: #0e2620;
  --pine: #1f4536;
  --paper: #f7f0e3;
  --paper-2: #efe5d2;
  --ink: #2b211b;
  --ink-soft: #6b5d52;
  --berry: #a3203a;
  --berry-ink: #fff6ee;
  --gold: #c9a14a;
  --moss: #4f7350;
  --line: rgba(43, 33, 27, .14);
  --snow: #ffffff;
  --on-night: #f3ead9;
  --ok-bg: #e2ecd9;  --ok-fg: #2f5a33;
  --no-bg: #f5dcdc;  --no-fg: #8d1d31;
  --wait-bg: #f4e7c7; --wait-fg: #7a5a12;
  --f-script: "Great Vibes", "Brush Script MT", cursive;
  --f-head: "Fraunces", Georgia, "Times New Roman", serif;
  --f-body: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--night);
  background-image: radial-gradient(1100px 620px at 50% -12%, var(--pine), var(--night) 62%);
  background-attachment: fixed;
  color: var(--ink);
  font: 15px/1.55 var(--f-body);
  -webkit-font-smoothing: antialiased;
}
#snow { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.wrap {
  position: relative; z-index: 1;
  max-width: 580px; margin: 0 auto;
  padding-block: 18px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap.wide { max-width: 1120px; }

/* top bar */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 34px; color: var(--on-night); }
.brand { font-family: var(--f-script); font-size: 30px; line-height: 1; color: var(--on-night); }
.brand small { font-family: var(--f-body); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; opacity: .7; margin-left: 8px; }
.lang { display: inline-flex; border: 1px solid rgba(243,234,217,.35); border-radius: 999px; padding: 3px; }
.lang button { appearance: none; border: 0; background: transparent; color: var(--on-night); font: 600 12px var(--f-body); letter-spacing: .08em; padding: 6px 12px; border-radius: 999px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--on-night); color: var(--night); }

.demo { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; justify-content: center; margin: -18px 0 22px; color: var(--on-night); font-size: 12px; }
.demo span { opacity: .75; }
.demo a { color: var(--on-night); border: 1px dashed rgba(243,234,217,.5); border-radius: 999px; padding: 4px 12px; text-decoration: none; font-weight: 600; }
.demo a[aria-current="page"] { background: rgba(243,234,217,.16); border-style: solid; }

/* card */
.card {
  position: relative; background: var(--paper); border-radius: 22px;
  padding: 76px 30px 28px;
  box-shadow: 0 40px 80px -30px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.05);
}
.card::after { content: ""; position: absolute; inset: 10px; border: 1px solid var(--line); border-radius: 15px; pointer-events: none; }
#garland { position: absolute; left: -14px; top: -22px; width: calc(100% + 28px); height: 78px; pointer-events: none; }
.baubles { position: absolute; left: 0; right: 0; top: 30px; display: flex; justify-content: center; gap: 16px; }
.baubles i { position: relative; width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--gold); background: var(--paper); transition: background .3s, transform .3s; }
.baubles i::before { content: ""; position: absolute; left: 50%; bottom: 100%; width: 1px; height: 9px; background: var(--gold); opacity: .7; }
.baubles i.done { background: var(--berry); border-color: var(--berry); }
.baubles i.now { background: var(--gold); transform: scale(1.3); box-shadow: 0 0 0 4px rgba(201,161,74,.22); }

.step { display: grid; gap: 18px; animation: rise .45s ease both; position: relative; z-index: 1; }
@keyframes rise { from { opacity: .35; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--moss); }
.center { text-align: center; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h2 { font: 600 30px/1.15 var(--f-head); letter-spacing: -.01em; }
h3 { font: 600 18px/1.3 var(--f-head); }
p { margin: 0; }
.muted { color: var(--ink-soft); }
.small { font-size: 13px; }
.script { font-family: var(--f-script); color: var(--berry); font-size: clamp(56px, 15vw, 84px); line-height: .92; font-weight: 400; }

/* invite date block, same layout as the printed invitation */
.when { display: flex; justify-content: center; align-items: center; gap: 16px; color: var(--berry); font-family: var(--f-head); }
.when span { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; }
.when b { font-size: 44px; font-weight: 600; line-height: 1; padding: 0 16px; border-left: 1px solid var(--berry); border-right: 1px solid var(--berry); }
.place { display: grid; gap: 2px; justify-items: center; }
.place strong { font: 600 17px var(--f-head); }

/* lists inside steps */
.bring-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.bring-list li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; }
.bring-list .ic { width: 28px; height: 28px; border-radius: 50%; background: var(--paper-2); display: grid; place-items: center; font-size: 14px; }
.nogift { background: var(--paper-2); border-radius: 14px; padding: 16px 18px; display: grid; gap: 6px; }
.ornament { width: 72px; height: 84px; margin: 0 auto; position: relative; }
.ornament::before { content: ""; position: absolute; left: 50%; top: 0; width: 16px; height: 12px; transform: translateX(-50%); background: var(--gold); border-radius: 3px; }
.ornament::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 72px; border-radius: 50%; background: radial-gradient(circle at 34% 30%, #e46a7c 0 8%, var(--berry) 40%, #6e1324 100%); box-shadow: inset 0 -8px 16px rgba(0,0,0,.2); }

/* form controls */
label.lbl { font-weight: 600; font-size: 14px; display: block; margin-bottom: 6px; }
input[type="text"], input[type="search"], textarea, select {
  width: 100%; box-sizing: border-box; font: 15px var(--f-body); color: var(--ink);
  background: #fffaf2; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
}
textarea { min-height: 92px; resize: vertical; }
input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.names { display: grid; gap: 6px; max-height: 340px; overflow-y: auto; padding: 2px; }
.name-btn { appearance: none; width: 100%; text-align: left; display: flex; justify-content: space-between; align-items: center; gap: 10px; border: 1px solid var(--line); background: #fffaf2; border-radius: 12px; padding: 11px 14px; font: 500 15px var(--f-body); color: var(--ink); cursor: pointer; }
.name-btn:hover { border-color: var(--gold); }
.name-btn[aria-pressed="true"] { border-color: var(--berry); background: #fbe9e6; }

.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.choice { appearance: none; border: 1.5px solid var(--line); background: #fffaf2; border-radius: 16px; padding: 22px 14px; cursor: pointer; display: grid; gap: 6px; justify-items: center; font: 600 16px var(--f-body); color: var(--ink); }
.choice .big { font-size: 30px; line-height: 1; }
.choice:hover { border-color: var(--gold); }
.choice[aria-pressed="true"] { border-color: var(--berry); background: #fbe9e6; }

.counter { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: #fffaf2; }
.counter .stepper { display: inline-flex; align-items: center; gap: 12px; }
.counter .stepper button { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper); font: 600 20px var(--f-body); color: var(--ink); cursor: pointer; }
.counter .stepper output { min-width: 24px; text-align: center; font: 600 22px var(--f-head); font-variant-numeric: tabular-nums; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { appearance: none; border: 1px solid var(--line); background: #fffaf2; border-radius: 999px; padding: 7px 13px; font: 500 13px var(--f-body); color: var(--ink); cursor: pointer; }
.chip:hover { border-color: var(--gold); }

.others { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding-block: 12px; display: grid; gap: 8px; max-height: 230px; overflow-y: auto; }
.others .row { display: grid; grid-template-columns: minmax(0, 40%) minmax(0, 1fr); gap: 12px; font-size: 14px; }
.others .row b { font-weight: 600; }
.bitem { font-size: 14px; padding-left: 14px; position: relative; }
.bitem::before { content: ""; position: absolute; left: 0; top: .6em; width: 6px; height: 6px; border-radius: 50%; background: var(--berry); }
.need { background: #fbf1d7; border: 1px solid #ead7a4; border-radius: 12px; padding: 12px 14px; font-size: 14px; }

.summary { display: grid; gap: 0; border-top: 1px solid var(--line); }
.summary .row { display: grid; grid-template-columns: 120px minmax(0, 1fr) auto; gap: 12px; padding-block: 11px; border-bottom: 1px solid var(--line); align-items: start; }
.summary .k { color: var(--ink-soft); font-size: 13px; }
.linkbtn { appearance: none; border: 0; background: none; color: var(--berry); font: 600 13px var(--f-body); cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 3px; }

.nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 6px; }
.btn { appearance: none; border: 0; border-radius: 999px; padding: 13px 24px; font: 700 15px var(--f-body); cursor: pointer; background: var(--berry); color: var(--berry-ink); text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover { filter: brightness(1.07); }
.btn[disabled] { opacity: .55; cursor: progress; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.gold { background: var(--gold); color: var(--ink); }
.err { color: var(--no-fg); font-weight: 600; font-size: 14px; }
.spacer { flex: 1; }

/* pills */
.pill { display: inline-block; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.pill.yes { background: var(--ok-bg); color: var(--ok-fg); }
.pill.no { background: var(--no-bg); color: var(--no-fg); }
.pill.pending { background: var(--wait-bg); color: var(--wait-fg); }

/* admin */
.adm-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px 24px; color: var(--on-night); margin-bottom: 18px; }
.adm-head h1 { font: 600 34px/1.1 var(--f-head); }
.adm-head .script { color: var(--gold); font-size: 44px; }
.adm-head p { opacity: .78; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat { background: var(--paper); border-radius: 16px; padding: 16px 18px; display: grid; gap: 4px; align-content: start; }
.stat .n { font: 600 40px/1 var(--f-head); font-variant-numeric: tabular-nums; }
.stat .l { font-size: 13px; color: var(--ink-soft); }
.stat.hero { background: var(--berry); color: var(--berry-ink); }
.stat.hero .l { color: var(--berry-ink); opacity: .85; }
.stat input[type="range"] { width: 100%; accent-color: var(--berry); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-bottom: 16px; }
.panel { background: var(--paper); border-radius: 16px; padding: 18px 20px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; align-content: start; min-width: 0; }
.panel h3 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.panel h3 small { font: 500 13px var(--f-body); color: var(--ink-soft); }
.plain { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.plain li { display: grid; grid-template-columns: minmax(0, 42%) minmax(0, 1fr); gap: 12px; padding-block: 8px; border-bottom: 1px solid var(--line); font-size: 14px; }
.plain li:last-child { border-bottom: 0; }
.plain li b { font-weight: 600; }
.empty { color: var(--ink-soft); font-size: 14px; }
.addform { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; }
.linkbox { display: flex; gap: 8px; align-items: center; }
.linkbox code { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; background: #fffaf2; border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font-size: 13px; user-select: all; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tab { appearance: none; border: 1px solid var(--line); background: #fffaf2; border-radius: 999px; padding: 7px 13px; font: 600 13px var(--f-body); color: var(--ink); cursor: pointer; }
.tab[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.toolbar input { max-width: 240px; padding: 8px 12px; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 760px; }
th { text-align: left; font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--line); }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.num { font-variant-numeric: tabular-nums; text-align: center; }
tr.editing td { background: #fbf3e4; }
.editgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.editgrid .full { grid-column: 1 / -1; }
.funnel-grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; margin-bottom: 16px; }
@media (max-width: 760px) { .funnel-grid { grid-template-columns: 1fr; } }
.funnel { display: flex; }
.inode { display: flex; flex-direction: column; gap: 6px; }
.ikids { display: flex; gap: 6px; }
.iblk { box-sizing: border-box; display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 10px; color: var(--berry-ink); min-height: 64px; min-width: 4.6rem; overflow: hidden; }
.iblk b { font: 600 28px/1 var(--f-head); font-variant-numeric: tabular-nums; }
.iblk span { font-size: 12.5px; line-height: 1.3; }
.iblk small { font-size: 11.5px; opacity: .8; }
.iblk.f-inv { background: var(--pine); }
.iblk.f-rep { background: #5c6b64; }
.iblk.f-wait { background: var(--gold); color: var(--ink); }
.iblk.f-yes { background: #2f6b3a; }
.iblk.f-no { background: var(--berry); }
.iblk.f-adult { background: #4f8a58; }
.iblk.f-kid { background: #86b07a; color: var(--ink); }
@media (max-width: 600px) {
  .funnel, .ikids { flex-direction: column; }
  .inode { flex: none !important; }
  .ikids { margin-left: 8px; padding-left: 12px; border-left: 2px solid var(--line); }
  .iblk { flex-direction: row; flex-wrap: wrap; align-items: baseline; column-gap: 8px; min-height: 0; min-width: 0; padding: 10px 14px; }
  .iblk b { font-size: 24px; }
  .iblk small { flex-basis: 100%; }
}
.est-n { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.est-n .n { font: 600 48px/1 var(--f-head); font-variant-numeric: tabular-nums; }
.panel input[type="range"] { width: 100%; accent-color: var(--berry); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 14px; z-index: 20; }

@media (max-width: 480px) {
  .card { padding: 72px 18px 22px; }
  h2 { font-size: 26px; }
  .summary .row { grid-template-columns: 1fr auto; }
  .summary .row .v { grid-column: 1 / -1; grid-row: 2; }
  .addform { grid-template-columns: 1fr 1fr; }
  .addform input { grid-column: 1 / -1; }
  .baubles { gap: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  .step { animation: none; }
  * { transition: none !important; }
}
</style>
</head>
<body>

<canvas id="snow" aria-hidden="true"></canvas>
<div class="wrap" id="wrap">
  <div class="topbar">
    <div class="brand">Christmas Party<small>2026</small></div>
    <div class="lang" role="group" aria-label="Jazyk / Language">
      <button type="button" data-lang="cs" aria-pressed="true">CZ</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
  <nav class="demo" id="demo" hidden>
    <span id="demoNote">Ukázka · změny se neukládají</span>
    <a href="#host" id="demoHost">Pohled hosta</a>
    <a href="#admin" id="demoAdmin">Admin</a>
  </nav>
  <main id="guestView">
    <section class="card">
      <canvas id="garland" aria-hidden="true"></canvas>
      <div class="baubles" id="baubles" aria-hidden="true"></div>
      <div id="stepHost"></div>
    </section>
  </main>
  <main id="adminView" hidden></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

const API_URL = 'https://script.google.com/macros/s/AKfycbxTyegbwbRI4T-DMaN1OAfMqEhvQFiHp17izpAOlmGsM1sP9nH4IyiLUj8k1rlHZ56TYw/exec';
const LIVE = !!(window.google && google.script && google.script.run);

const SEED = [];
const Demo = (function () {
  const rows = SEED.map(function (r) {
    return { name: r[0], status: r[1] ? 'yes' : (r[2] ? 'no' : 'pending'), adults: r[4] ? 2 : 1, kids: parseInt(r[5], 10) || 0, kidsRaw: r[5], bring: r[3], diet: r[6], updated: '' };
  });
  let need = '';
  const copy = function (x) { return JSON.parse(JSON.stringify(x)); };
  const find = function (n) { const g = rows.find(function (r) { return r.name === n; }); if (!g) throw new Error('Jméno v seznamu není.'); return g; };
  const pub = function () { return copy({ guests: rows.map(function (g) { return { name: g.name, adults: g.adults }; }), bring: rows.filter(function (g) { return g.status !== 'no' && g.bring; }).map(function (g) { return g.bring; }), need: need }); };
  const adm = function () { return copy({ guests: rows, need: need, guestUrl: 'https://script.google.com/macros/s/…/exec' }); };
  const write = function (p) { const g = find(p.name); Object.assign(g, { status: p.status, adults: +p.adults || 1, kids: +p.kids || 0, kidsRaw: (+p.kids || '') + '', bring: p.bring || '', diet: p.diet || '', updated: new Date().toISOString() }); };
  return {
    getPublicData: pub,
    getMyRsvp: function (n) { const g = find(n); return copy(g); },
    submitRsvp: function (p) { write(p); return pub(); },
    getAdminData: function () { return adm(); },
    adminUpdate: function (k, p) { write(p); return adm(); },
    setNeed: function (k, t) { need = t; return adm(); },
    addGuest: function (k, n, a) {
      n = String(n || '').trim();
      if (!n) throw new Error('Zadejte jméno.');
      if (rows.some(function (r) { return r.name.toLowerCase() === n.toLowerCase(); })) throw new Error('"' + n + '" už v seznamu je.');
      rows.push({ name: n, status: 'pending', adults: +a >= 2 ? 2 : 1, kids: 0, kidsRaw: '', bring: '', diet: '', updated: '' });
      return adm();
    }
  };
})();

function call(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  if (API_URL) {
    return fetch(API_URL, { method: 'POST', redirect: 'follow', credentials: 'omit', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (j) { if (!j.ok) throw new Error(j.error || 'Chyba'); return j.data; });
  }
  if (!LIVE) return new Promise(function (res, rej) { setTimeout(function () { try { res(Demo[fn].apply(null, args)); } catch (e) { rej(e); } }, 250); });
  return new Promise(function (res, rej) {
    const r = google.script.run.withSuccessHandler(res).withFailureHandler(rej);
    r[fn].apply(r, args);
  });
}

const $ = function (s, el) { return (el || document).querySelector(s); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function fill(s, v) { Object.keys(v || {}).forEach(function (k) { s = s.split('{' + k + '}').join(v[k]); }); return s; }

try { const l = localStorage.getItem('rsvp-lang'); if (l === 'en' || l === 'cs') lang = l; } catch (e) {}

function ta(k, v) { return fill(A18N[lang][k] != null ? A18N[lang][k] : A18N.cs[k], v); }

let toastTimer;

function appendChip(id, text) {
  const el = document.getElementById(id); if (!el) return;
  const cur = el.value.trim();
  if (cur.toLowerCase().indexOf(text.toLowerCase()) >= 0) return;
  el.value = cur ? cur + ', ' + text : text;
  el.dispatchEvent(new Event('input', { bubbles: true }));
  el.focus();
}

/* ------------------------------------------------------------- graphics */
function drawGarland() {
  const c = $('#garland'); if (!c || $('#guestView').hidden) return;
  const r = c.getBoundingClientRect(); const dpr = window.devicePixelRatio || 1;
  if (!r.width) return;
  c.width = r.width * dpr; c.height = r.height * dpr;
  const x = c.getContext('2d'); x.scale(dpr, dpr);
  const W = r.width, sag = 14, y0 = 16;
  const curve = function (u) { return y0 + Math.sin(u * Math.PI) * sag; };
  let seed = 7; const rnd = function () { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  const greens = ['#1d4a36', '#2c5f43', '#3c7552', '#567f5a', '#24533c'];
  x.lineCap = 'round';
  for (let i = 0; i < 900; i++) {
    const u = rnd(); const px = u * W, py = curve(u) + (rnd() - .5) * 12;
    const ang = (rnd() - .5) * Math.PI * 1.6 + (rnd() < .5 ? 0 : Math.PI);
    const len = 7 + rnd() * 9;
    x.strokeStyle = greens[(rnd() * greens.length) | 0]; x.lineWidth = 1.4;
    x.beginPath(); x.moveTo(px, py); x.lineTo(px + Math.cos(ang) * len, py + Math.sin(ang) * len * .7); x.stroke();
  }
  // bow in the middle
  const bx = W / 2, by = curve(.5) - 2;
  x.fillStyle = '#a3203a';
  x.beginPath(); x.ellipse(bx - 13, by, 13, 7, -.35, 0, Math.PI * 2); x.fill();
  x.beginPath(); x.ellipse(bx + 13, by, 13, 7, .35, 0, Math.PI * 2); x.fill();
  x.beginPath(); x.moveTo(bx - 3, by + 2); x.quadraticCurveTo(bx - 14, by + 22, bx - 20, by + 30); x.lineTo(bx - 14, by + 31); x.quadraticCurveTo(bx - 6, by + 20, bx + 1, by + 4); x.fill();
  x.beginPath(); x.moveTo(bx + 3, by + 2); x.quadraticCurveTo(bx + 14, by + 22, bx + 20, by + 30); x.lineTo(bx + 14, by + 31); x.quadraticCurveTo(bx + 6, by + 20, bx - 1, by + 4); x.fill();
  x.fillStyle = '#7d1529'; x.beginPath(); x.arc(bx, by + 1, 5, 0, Math.PI * 2); x.fill();
  // berries
  for (let i = 0; i < 16; i++) {
    const u = .04 + rnd() * .92; if (Math.abs(u - .5) < .06) continue;
    x.fillStyle = rnd() < .75 ? '#b3253f' : '#c9a14a';
    x.beginPath(); x.arc(u * W, curve(u) + (rnd() - .5) * 8, 2.6 + rnd() * 1.4, 0, Math.PI * 2); x.fill();
  }
}
function snow() {
  const c = $('#snow'); const x = c.getContext('2d');
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, flakes = [];
  const size = function () {
    const dpr = window.devicePixelRatio || 1; W = innerWidth; H = innerHeight;
    c.width = W * dpr; c.height = H * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0);
    flakes = Array.from({ length: Math.round(W * H / 9000) }, function () { return { x: Math.random() * W, y: Math.random() * H, r: .6 + Math.random() * 2.2, s: .25 + Math.random() * .7, d: Math.random() * 6.28 }; });
    if (reduce) frame();
  };
  const frame = function () {
    x.clearRect(0, 0, W, H); x.fillStyle = 'rgba(255,255,255,.75)';
    flakes.forEach(function (f) {
      if (!reduce) { f.y += f.s; f.d += .01; f.x += Math.sin(f.d) * .3; if (f.y > H + 4) { f.y = -4; f.x = Math.random() * W; } }
      x.globalAlpha = .35 + f.r / 4; x.beginPath(); x.arc(f.x, f.y, f.r, 0, 6.283); x.fill();
    });
    x.globalAlpha = 1;
    if (!reduce) requestAnimationFrame(frame);
  };
  addEventListener('resize', function () { size(); drawGarland(); });
  size(); if (!reduce) requestAnimationFrame(frame);
}

}
})();
